name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for the whole workflow. No job needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1 pinned to commit SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0 pinned to commit SHA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Install project with dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Mypy (strict type-check)
        run: python -m mypy

      - name: Tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=95

      - name: Verify installed wheel and runtime inventory on this platform
        shell: bash
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/ghorgsec-wheel"
          python -m venv "$RUNNER_TEMP/ghorgsec-runtime"
          if [ "$RUNNER_OS" = "Windows" ]; then
            runtime_python="$RUNNER_TEMP/ghorgsec-runtime/Scripts/python.exe"
          else
            runtime_python="$RUNNER_TEMP/ghorgsec-runtime/bin/python"
          fi
          "$runtime_python" -m pip install --require-hashes -r requirements-runtime.lock --report "$RUNNER_TEMP/runtime-install.json"
          "$runtime_python" -m pip install --no-deps "$RUNNER_TEMP"/ghorgsec-wheel/ghorgsec-*.whl --report "$RUNNER_TEMP/application-install.json"
          "$runtime_python" -m pip check
          "$runtime_python" scripts/smoke_installed.py examples/org-security-snapshot.json
          python scripts/build_sbom.py --report "$RUNNER_TEMP/runtime-install.json" --report "$RUNNER_TEMP/application-install.json" --wheel "$RUNNER_TEMP"/ghorgsec-wheel/ghorgsec-*.whl --output "$RUNNER_TEMP/runtime.cdx.json"

      - name: Retain platform runtime inventory
        # actions/upload-artifact v7.0.2, same verified pin as the release workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-${{ runner.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/runtime.cdx.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build, installed CLI, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install build and audit tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Audit runtime and development dependencies
        run: python scripts/audit_environment.py

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Verify the installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ghorgsec-smoke"
          "$RUNNER_TEMP/ghorgsec-smoke/bin/python" -m pip install --require-hashes -r requirements-runtime.lock
          "$RUNNER_TEMP/ghorgsec-smoke/bin/python" -m pip install --no-deps dist/ghorgsec-*.whl
          "$RUNNER_TEMP/ghorgsec-smoke/bin/python" scripts/smoke_installed.py examples/org-security-snapshot.json

  required:
    # Preserve the existing protected-branch check name and require every lane.
    name: Lint, type-check, test
    needs: [quality, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful quality and package jobs
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
