name: Secrets hygiene pilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Secrets hygiene pilot (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          pilot_dir="$RUNNER_TEMP/secguard-pilot"
          mkdir "$pilot_dir"
          archive="$pilot_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$pilot_dir" gitleaks
          test "$("$pilot_dir/gitleaks" version)" = "8.30.1"
          printf '[extend]\nuseDefault = true\n' > "$pilot_dir/default.toml"
          mkdir "$pilot_dir/empty-ignores"
          printf 'SECGUARD_PILOT_DIR=%s\n' "$pilot_dir" >> "$GITHUB_ENV"

      - name: Collect a fresh redacted history report
        id: scanner
        shell: bash
        run: |
          set -euo pipefail
          "$SECGUARD_PILOT_DIR/gitleaks" git \
            --config "$SECGUARD_PILOT_DIR/default.toml" \
            --gitleaks-ignore-path "$SECGUARD_PILOT_DIR/empty-ignores" \
            --ignore-gitleaks-allow --redact --exit-code 0 \
            --no-banner --no-color --report-format json \
            --report-path "$SECGUARD_PILOT_DIR/gitleaks.json" .
          test -f "$SECGUARD_PILOT_DIR/gitleaks.json"

      # Observation phase: BLOCK is reported; ERROR is rejected by the next step.
      - name: Evaluate findings at high severity
        id: gate
        continue-on-error: true
        uses: lucashgrifoni/secrets-hygiene-kit@143148bec7ed35187152d350b4122307c24afd59 # v0.4.0
        with:
          reports: ${{ runner.temp }}/secguard-pilot/gitleaks.json
          fail-on: high
          sarif-output: ${{ runner.temp }}/secguard-pilot/secguard.sarif
          markdown-output: ${{ runner.temp }}/secguard-pilot/report.md
          comment-output: ${{ runner.temp }}/secguard-pilot/comment.md

      - name: Reject missing decisions and execution errors
        if: always()
        shell: bash
        env:
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
        run: |
          set -euo pipefail
          test "$SCANNER_OUTCOME" = "success"
          case "$GATE_VERDICT" in
            PASS) test "$GATE_OUTCOME" = "success" ;;
            BLOCK) test "$GATE_OUTCOME" = "failure" ;;
            *) echo "No valid decision: scanner or secguard failed." >&2; exit 1 ;;
          esac
          {
            printf '## Secrets hygiene pilot\n\n'
            printf 'Mode: report-only. High-severity decision: **%s**.\n\n' "$GATE_VERDICT"
            printf 'Findings are observed in this phase; scanner and processing errors fail the job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify controlled BLOCK, PASS and error handling
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          pilot = Path(os.environ["SECGUARD_PILOT_DIR"])
          lab = Path(tempfile.mkdtemp(prefix="secguard-control-"))
          fixture = lab / "example.env"
          scan = [
              str(pilot / "gitleaks"), "dir", "--redact", "--exit-code", "0",
              "--config", str(pilot / "default.toml"),
              "--gitleaks-ignore-path", str(pilot / "empty-ignores"),
              "--no-banner", "--no-color", "--report-format", "json",
          ]
          for label, content, expected in (
              ("block", "GITHUB_TOKEN=" + "ghp_" + "4b8e1C7f2" + "A9d6E3g5H" + "0j8K2m4N7" + "p1Q6r9S3t", 1),
              ("pass", "APP_MODE=demo", 0),
          ):
              fixture.write_text(content + "\n", encoding="utf-8")
              report = lab / (label + ".json")
              # Scan only the fixture: prior report files must not become inputs.
              completed = subprocess.run(
                  scan + ["--report-path", str(report), "example.env"],
                  cwd=lab, capture_output=True, check=False,
              )
              if completed.returncode != 0:
                  raise SystemExit("Controlled scanner execution failed")
              findings = json.loads(report.read_text(encoding="utf-8"))
              if bool(findings) != (expected == 1):
                  raise SystemExit("Controlled scanner returned unexpected findings")
              gate = subprocess.run(
                  ["secguard", "scan", "check", "--input", str(report), "--fail-on", "high"],
                  cwd=lab, capture_output=True, check=False,
              )
              if gate.returncode != expected:
                  raise SystemExit(f"Controlled {label}: unexpected gate exit {gate.returncode}")
              print(f"Controlled {label}: secguard exit {gate.returncode}")
          error = subprocess.run(
              [str(pilot / "gitleaks"), "git", "--config", str(lab / "missing.toml"), "--exit-code", "0", "."],
              capture_output=True, check=False,
          )
          if error.returncode == 0:
              raise SystemExit("Scanner operational error was accepted")
          malformed = lab / "malformed.json"
          malformed.write_text("{", encoding="utf-8")
          error = subprocess.run(
              ["secguard", "scan", "check", "--input", str(malformed)],
              cwd=lab, capture_output=True, check=False,
          )
          if error.returncode != 2:
              raise SystemExit("secguard processing error was accepted")
          print("Operational scanner error rejected; secguard processing error exit 2")
          PY

      - name: Upload normalized review reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secguard-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/secguard-pilot/secguard.sarif
            ${{ runner.temp }}/secguard-pilot/report.md
            ${{ runner.temp }}/secguard-pilot/comment.md
          if-no-files-found: error
          retention-days: 7
