[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ghorgsec"
version = "0.1.0"
description = "Read-only GitHub organization security dashboard skeleton."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Lucas Henrique Grifoni" },
]
keywords = [
    "appsec",
    "devsecops",
    "github",
    "security-dashboard",
    "read-only",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1.0",
]

[project.urls]
Homepage = "https://github.com/lucashgrifoni/GitHub-Org-Security-Dashboard"
Repository = "https://github.com/lucashgrifoni/GitHub-Org-Security-Dashboard"
Changelog = "https://github.com/lucashgrifoni/GitHub-Org-Security-Dashboard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.15,<0.17",
    "mypy>=1.18,<2.0",
    "pytest>=9.0.3,<10.0",
    "coverage>=7.0,<8.0",
]

[project.scripts]
ghorgsec = "ghorgsec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghorgsec"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["ghorgsec"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ghorgsec"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
